name: Backend deploy

# Manual only: a merge never restarts the backend. See deploy/backend/README.md.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character feat/m2 commit to deploy
        required: true
        type: string
      maintenance_confirmed:
        description: "Maintenance window confirmed: no new or running sessions, uploads finished, old tabs handled"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Shared with backend-rollback.yml: one production change at a time, never cancelled midway.
concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write the SSH key and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          test -s "$RUNNER_TEMP/deploy_key" || { echo 'Secret DEPLOY_SSH_KEY is missing.'; exit 1; }
          test -s "$RUNNER_TEMP/known_hosts" || { echo 'Secret DEPLOY_KNOWN_HOSTS is missing.'; exit 1; }

      - name: Deploy (release, preflight, backup, cutover, checks)
        env:
          DEPLOY_ACTION: deploy
          DEPLOY_COMMIT: ${{ inputs.commit }}
          MAINTENANCE_CONFIRMED: ${{ inputs.maintenance_confirmed }}
          DEPLOY_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY_FILE: ${{ runner.temp }}/deploy_key
          DEPLOY_KNOWN_HOSTS_FILE: ${{ runner.temp }}/known_hosts
          DEPLOY_OUT: ${{ runner.temp }}/deploy-out
        run: bash deploy/backend/ci-deploy.sh

      - name: Summary
        if: always()
        env:
          DEPLOY_COMMIT: ${{ inputs.commit }}
          OUT: ${{ runner.temp }}/deploy-out
        run: |
          {
            echo "### Backend deploy"
            echo "- commit: \`$DEPLOY_COMMIT\`"
            if git cat-file -e "$DEPLOY_COMMIT^{commit}" 2>/dev/null; then
              echo "- tree: \`$(git rev-parse "$DEPLOY_COMMIT^{tree}")\`"
            fi
            if [ -f "$OUT/stage/mindprobe-release.sha256" ]; then
              echo "- release sha256 (tar bytes depend on the git version; compare commit and tree):"
              echo '```'; cat "$OUT/stage/mindprobe-release.sha256"; echo '```'
            fi
            echo "- host log: /opt/mindprobe/deploy-logs/gh-${{ github.run_id }}-${{ github.run_attempt }}.log (copy in the artifact)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key"

      - name: Keep the deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/deploy-out/deploy-*.log
            ${{ runner.temp }}/deploy-out/stage/mindprobe-release.env
            ${{ runner.temp }}/deploy-out/stage/mindprobe-release.sha256
          if-no-files-found: warn
          retention-days: 90
